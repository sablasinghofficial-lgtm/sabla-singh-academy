<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enquiries - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/auth-guard.js"></script>
    <script type="module" src="js/firebase-init.js"></script>
    <style>
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .filter-bar input, .filter-bar select { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 0.9rem; }
        .msg-cell { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: var(--gold); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .modal-header h3 { color: var(--primary); font-family: 'Playfair Display', serif; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .modal-body p { margin-bottom: 10px; font-size: 0.95rem; }
        .modal-body strong { color: var(--primary); }
        .modal-msg { background: var(--bg); padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 3px solid var(--gold); }
        .status-select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; font-weight: 600; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo_transparent.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html" class="active"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="services.html"><i class="fas fa-gem"></i> Services</a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Enquiries Inbox</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by name or phone..." onkeyup="filterQueries()" style="flex: 1; max-width: 300px;">
                <select id="statusFilter" onchange="filterQueries()">
                    <option value="All">All Statuses</option>
                    <option value="New">New</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Contact</th>
                            <th>Interested In</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="queriesTable">
                        <tr><td colspan="7" style="text-align:center;">Loading enquiries...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Enquiry Details</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, doc, deleteDoc, updateDoc } from './js/firebase-init.js';

        let allQueries = [];

        async function loadQueries() {
            const tbody = document.getElementById('queriesTable');
            try {
                if (db && collection && getDocs) {
                    const qSnap = await getDocs(collection(db, 'queries'));
                    allQueries = [];
                    qSnap.forEach(d => {
                        allQueries.push({ id: d.id, ...d.data() });
                    });
                    allQueries.sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                    renderQueries(allQueries);
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:25px;">No enquiries received yet.</td></tr>';
                }
            } catch (err) {
                console.log("Firestore enquiries notice:", err.message);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:25px;">No new website enquiries yet. Website enquiries also route directly to WhatsApp (+91 8603388406).</td></tr>';
            }
        }

        window.renderQueries = function(queries) {
            const tbody = document.getElementById('queriesTable');
            tbody.innerHTML = '';
            
            if (queries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:25px;">No enquiries found.</td></tr>';
                return;
            }

            queries.forEach(q => {
                const date = q.created_at ? new Date(q.created_at).toLocaleString() : 'Recent';
                const status = q.status || 'New';
                tbody.innerHTML += `
                    <tr>
                        <td style="white-space:nowrap;font-size:0.85rem;color:#888;">${date}</td>
                        <td><strong>${q.name || '-'}</strong></td>
                        <td>${q.phone || '-'}<br><span style="font-size:0.8rem;color:#888;">${q.email||''}</span></td>
                        <td>${q.interested_in || 'Course / Service'}</td>
                        <td class="msg-cell" onclick='viewQuery(${JSON.stringify(q).replace(/'/g, "&#39;")})'>${q.message || '<em style="color:#aaa;">No message</em>'}</td>
                        <td>
                            <select class="status-select" onchange="updateStatus('${q.id}', this.value)">
                                <option value="New" ${status === 'New' ? 'selected' : ''}>New</option>
                                <option value="Contacted" ${status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="Resolved" ${status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </td>
                        <td class="action-btns">
                            <button title="View Details" onclick='viewQuery(${JSON.stringify(q).replace(/'/g, "&#39;")})'><i class="fas fa-eye"></i></button>
                            <button title="Delete" onclick="deleteQuery('${q.id}')" style="color:#dc3545;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        };

        window.filterQueries = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            const filtered = allQueries.filter(q => {
                const nameMatch = q.name ? q.name.toLowerCase().includes(search) : false;
                const phoneMatch = q.phone ? q.phone.includes(search) : false;
                const matchesSearch = nameMatch || phoneMatch;
                const qStatus = q.status || 'New';
                const matchesStatus = status === 'All' || qStatus === status;
                return matchesSearch && matchesStatus;
            });
            renderQueries(filtered);
        };

        window.updateStatus = async function(id, status) {
            try {
                if (db && updateDoc && doc) {
                    await updateDoc(doc(db, 'queries', id), { status });
                }
                const q = allQueries.find(x => x.id === id);
                if(q) q.status = status;
            } catch (err) {
                console.error(err);
            }
        };

        window.deleteQuery = async function(id) {
            if(confirm('Are you sure you want to delete this enquiry?')) {
                try {
                    if (db && deleteDoc && doc) {
                        await deleteDoc(doc(db, 'queries', id));
                    }
                    allQueries = allQueries.filter(x => x.id !== id);
                    renderQueries(allQueries);
                } catch (err) {
                    console.error(err);
                }
            }
        };

        window.viewQuery = function(q) {
            const date = q.created_at ? new Date(q.created_at).toLocaleString() : 'Recent';
            const status = q.status || 'New';
            let html = `
                <p><strong>Date:</strong> ${date}</p>
                <p><strong>Name:</strong> ${q.name || '-'}</p>
                <p><strong>Phone:</strong> <a href="tel:${q.phone}">${q.phone || '-'}</a></p>
                <p><strong>Email:</strong> ${q.email ? `<a href="mailto:${q.email}">${q.email}</a>` : '-'}</p>
                <p><strong>Interested In:</strong> ${q.interested_in || 'General Enquiry'}</p>
                <p><strong>Status:</strong> <span class="badge ${status.toLowerCase()}">${status}</span></p>
                <div class="modal-msg">${q.message || 'No additional message provided.'}</div>
                <div style="margin-top:20px;text-align:right;">
                    <a href="https://wa.me/91${q.phone}" target="_blank" class="btn-gold" style="text-decoration:none;display:inline-block;padding:10px 20px;width:auto;"><i class="fab fa-whatsapp"></i> WhatsApp Client</a>
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('viewModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('viewModal').style.display = 'none';
        };

        loadQueries();
    </script>
</body>
</html>
