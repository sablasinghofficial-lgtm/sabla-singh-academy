<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/auth-guard.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header p { font-size: 1.1rem; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 1.05rem; font-weight: 700; }
        .btn-add:hover { background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .srv-img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 35px; border-radius: 16px; width: 100%; max-width: 650px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { color: var(--primary); font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .close-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo_transparent.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="services.html"><i class="fas fa-gem"></i> Services</a>
            <a href="courses.html" class="active"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Manage Courses</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="page-header">
                <p style="color:var(--text-muted);">Manage professional academy courses displayed on the public website.</p>
                <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Add New Course</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Course Title</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTable">
                        <tr><td colspan="5" style="text-align:center;">Loading courses...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="courseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Course</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <form id="courseForm">
                <input type="hidden" id="cId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Course Title</label>
                        <input type="text" id="sTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Duration / Badge</label>
                        <input type="text" id="sDuration" placeholder="e.g. 90 Days Master Diploma">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subtitle / Short Description</label>
                    <input type="text" id="sSubtitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Image Filename or URL</label>
                        <input type="text" id="sImage" placeholder="course_makeup.jpg">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="sStatus" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ddd;">
                            <option value="Active">Active</option>
                            <option value="Upcoming">Upcoming</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn-gold" style="font-size:1.1rem; padding: 14px; margin-top: 15px;" onclick="saveCourse(this)"><i class="fas fa-save"></i> Save Course</button>
            </form>
        </div>
    </div>

    <script>
        const defaultCourses = [
            {
                id: 1,
                title: "Master in Bridal & HD Makeup Artistry",
                subtitle: "Full bridal, airbrush, HD makeup techniques with hands-on practice & portfolio build.",
                duration: "90 Days Master Diploma",
                image: "course_makeup.jpg",
                status: "Active"
            },
            {
                id: 2,
                title: "Advanced Hair Designing & Styling",
                subtitle: "Bridal hairstyles, chemical treatments, hair botox, smoothening & modern cuts.",
                duration: "60 Days Certified Course",
                image: "course_hair.jpg",
                status: "Active"
            },
            {
                id: 3,
                title: "Professional Cosmetology & Skin Diploma",
                subtitle: "Comprehensive skin therapy, anti-aging, chemical peels, electro-therapy & spa treatments.",
                duration: "90 Days Diploma",
                image: "course_cosmetology.jpg",
                status: "Active"
            },
            {
                id: 4,
                title: "Nail Art & Lash Extension Masterclass",
                subtitle: "Gel & acrylic extensions, 3D nail art, ombre, lash lift & Russian volume eyelash extensions.",
                duration: "30 Days Specialization",
                image: "course_nails.jpg",
                status: "Active"
            }
        ];

        let allcourses = JSON.parse(localStorage.getItem('admin_courses')) || defaultCourses;

        function renderCourses() {
            const tbody = document.getElementById('coursesTable');
            tbody.innerHTML = '';
            
            allcourses.forEach(s => {
                const imgPath = s.image.startsWith('http') ? s.image : '../' + s.image;
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${imgPath}" class="srv-img-preview" alt="img" onerror="this.src='../logo_transparent.png'"></td>
                        <td><strong style="font-size:1.1rem; color:var(--primary);">${s.title}</strong><br><span style="font-size:0.9rem;color:#777;">${s.subtitle}</span></td>
                        <td><span style="font-weight:600; color:var(--gold);">${s.duration || 'Certified'}</span></td>
                        <td><span class="badge" style="background:#d4edda;color:#155724;font-size:0.85rem;padding:6px 12px;border-radius:20px;">${s.status}</span></td>
                        <td class="action-btns">
                            <button title="Edit" onclick='editCourse(${s.id})' style="font-size:1.1rem;margin-right:12px;color:var(--gold);"><i class="fas fa-edit"></i> Edit</button>
                            <button title="Delete" onclick="deleteCourse(${s.id})" style="font-size:1.1rem;color:#dc3545;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New Course';
            document.getElementById('cId').value = '';
            document.getElementById('courseForm').reset();
            document.getElementById('courseModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('courseModal').style.display = 'none';
        }

        function editCourse(id) {
            const s = allcourses.find(x => x.id === id);
            if(!s) return;
            document.getElementById('modalTitle').innerText = 'Edit Course: ' + s.title;
            document.getElementById('cId').value = s.id;
            document.getElementById('sTitle').value = s.title;
            document.getElementById('sDuration').value = s.duration || '';
            document.getElementById('sSubtitle').value = s.subtitle;
            document.getElementById('sImage').value = s.image;
            document.getElementById('sStatus').value = s.status || 'Active';
            document.getElementById('courseModal').style.display = 'flex';
        }

        function saveCourse(btn) {
            const id = document.getElementById('cId').value;
            const title = document.getElementById('sTitle').value.trim();
            const subtitle = document.getElementById('sSubtitle').value.trim();
            const duration = document.getElementById('sDuration').value.trim();
            const image = document.getElementById('sImage').value.trim() || 'course_makeup.jpg';
            const status = document.getElementById('sStatus').value;

            if (!title) {
                alert('Please enter course title');
                return;
            }

            if (id) {
                const idx = allcourses.findIndex(x => x.id == id);
                if (idx !== -1) {
                    allcourses[idx] = { ...allcourses[idx], title, subtitle, duration, image, status };
                }
            } else {
                const newId = Date.now();
                allcourses.push({ id: newId, title, subtitle, duration, image, status });
            }

            localStorage.setItem('admin_courses', JSON.stringify(allcourses));
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
            btn.style.background = '#28a745';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                closeModal();
                renderCourses();
            }, 800);
        }

        function deleteCourse(id) {
            if(confirm('Are you sure you want to delete this course?')) {
                allcourses = allcourses.filter(x => x.id !== id);
                localStorage.setItem('admin_courses', JSON.stringify(allcourses));
                renderCourses();
            }
        }

        renderCourses();
    </script>
</body>
</html>
