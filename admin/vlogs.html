<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vlogs - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header p { font-size: 1.2rem; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 1.2rem; font-weight: 700; }
        .btn-add:hover { background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .vlog-thumb-preview { width: 140px; height: 80px; object-fit: cover; border-radius: 12px; background: #eee; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 40px; border-radius: 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { color: var(--primary); font-family: 'Playfair Display', serif; font-size: 2rem; }
        .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="services.html"><i class="fas fa-gem"></i> Services</a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html" class="active"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Manage Videos & Vlogs</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="page-header">
                <p style="color:var(--text-muted);">Manage the videos/reels shown on the Vlogs page.</p>
                <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Add New Video</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Thumbnail</th>
                            <th>Video Title</th>
                            <th>Video Link</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vlogsTable">
                        <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="vlogModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Video</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <form id="vlogForm">
                <input type="hidden" id="vId">
                
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="vTitle" placeholder="e.g. Bridal Makeup Transformation" required>
                </div>
                
                <div class="form-group">
                    <label>Thumbnail Photo Name / Link (Cover Image)</label>
                    <input type="text" id="vThumb" placeholder="e.g. gal1.jpg OR https://...">
                </div>

                <div class="form-group">
                    <label>Video Link (YouTube URL or Local MP4)</label>
                    <input type="text" id="vLink" placeholder="e.g. sablasinghofficial.mp4 OR https://youtube.com/..." required>
                </div>
                
                <button type="button" class="btn-gold" style="font-size:1.3rem; padding: 15px; margin-top: 15px;" onclick="saveVlog(this)"><i class="fas fa-save"></i> Save Video</button>
            </form>
        </div>
    </div>

    <script>
        let allVlogs = [];

        async function loadVlogs() {
            const res = await fetch('/api/admin/vlogs');
            if (res.status === 401) window.location.href = 'login.html';
            allVlogs = await res.json();
            
            const tbody = document.getElementById('vlogsTable');
            tbody.innerHTML = '';
            
            if(allVlogs.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No videos found.</td></tr>';
                 return;
            }

            allVlogs.forEach(v => {
                const thumb = v.thumbnail ? (v.thumbnail.startsWith('http') ? v.thumbnail : '../' + v.thumbnail) : '../logo.png';
                const linkLabel = v.video_url && v.video_url.includes('youtube') ? '<i class="fab fa-youtube" style="color:#f00;"></i> YouTube' : '<i class="fas fa-video" style="color:var(--gold);"></i> MP4 Video';
                
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${thumb}" class="vlog-thumb-preview" alt="Thumb" onerror="this.src='../logo.png'"></td>
                        <td><strong style="font-size:1.2rem;">${v.title || 'Untitled Video'}</strong></td>
                        <td style="font-size:1.05rem;color:#555;">${linkLabel}<br><span style="font-size:0.85rem;word-break:break-all;">${v.video_url}</span></td>
                        <td class="action-btns">
                            <button title="Edit" onclick='editVlog(${v.id})' style="font-size:1.3rem;margin-right:15px;color:var(--gold);"><i class="fas fa-edit"></i> Edit</button>
                            <button title="Delete" onclick="deleteVlog(${v.id})" style="font-size:1.3rem;color:#dc3545;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New Video';
            document.getElementById('vId').value = '';
            document.getElementById('vlogForm').reset();
            document.getElementById('vlogModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('vlogModal').style.display = 'none';
        }

        function editVlog(id) {
            const v = allVlogs.find(x => x.id === id);
            if(!v) return;
            document.getElementById('modalTitle').innerText = 'Edit Video';
            document.getElementById('vId').value = v.id;
            document.getElementById('vTitle').value = v.title;
            document.getElementById('vThumb').value = v.thumbnail;
            document.getElementById('vLink').value = v.video_url;
            document.getElementById('vlogModal').style.display = 'flex';
        }

        async function saveVlog(btn) {
            const id = document.getElementById('vId').value;
            const data = {
                title: document.getElementById('vTitle').value,
                thumbnail: document.getElementById('vThumb').value,
                video_url: document.getElementById('vLink').value,
                status: 'published'
            };

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const url = id ? `/api/admin/vlogs/${id}` : `/api/admin/vlogs`;
            const method = id ? 'PUT' : 'POST';

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            btn.innerHTML = '<i class="fas fa-check"></i> Saved';
            btn.style.background = '#28a745';
            btn.style.color = '#fff';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                btn.style.color = '';
                btn.disabled = false;
                closeModal();
                loadVlogs();
            }, 1000);
        }

        async function deleteVlog(id) {
            if(confirm('Are you sure you want to delete this video?')) {
                await fetch(`/api/admin/vlogs/${id}`, { method: 'DELETE' });
                loadVlogs();
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'login.html';
        }

        loadVlogs();
    </script>
</body>
</html>
