<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gallery - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
        .btn-add:hover { background: #000; }
        .srv-img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="gallery.html" class="active"><i class="fas fa-gem"></i> gallery</a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Manage Gallery</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="page-header">
                <p style="color:var(--text-muted);">Manage the gallery displayed on the public website.</p>
                <button class="btn-add" onclick="alert('Upload Photo modal would open here')"><i class="fas fa-plus"></i> Upload Photo</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Image</th>
                            <th>Image Title</th>
                            <th>Features Count</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="galleryTable">
                        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadgallery() {
            const res = await fetch('/api/admin/gallery');
            if (res.status === 401) window.location.href = 'login.html';
            const gallery = await res.json();
            
            const tbody = document.getElementById('galleryTable');
            tbody.innerHTML = '';
            
            gallery.forEach(s => {
                const featCount = s.features ? s.features.split('|').length : 0;
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${s.display_order}</strong></td>
                        <td><img src="../${s.image}" class="srv-img-preview" alt="img" onerror="this.src='../logo.png'"></td>
                        <td><strong><i class="${s.icon}" style="color:var(--gold);margin-right:5px;"></i> ${s.title}</strong><br><span style="font-size:0.8rem;color:#888;">${s.subtitle}</span></td>
                        <td>${featCount} features</td>
                        <td><span class="badge" style="background:#d4edda;color:#155724;">${s.status}</span></td>
                        <td class="action-btns">
                            <button title="Edit" onclick="alert('Edit service ${s.id}')"><i class="fas fa-edit"></i></button>
                            <button title="Delete" onclick="deletePhoto(${s.id})" style="color:#dc3545;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deletePhoto(id) {
            if(confirm('Are you sure you want to delete this service?')) {
                await fetch(`/api/admin/gallery/${id}`, { method: 'DELETE' });
                loadgallery();
            }
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'login.html';
        }

        loadgallery();
    </script>
</body>
</html>
