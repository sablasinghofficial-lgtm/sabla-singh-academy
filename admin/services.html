<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Services - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/auth-guard.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header p { font-size: 1.1rem; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 1.05rem; font-weight: 700; }
        .btn-add:hover { background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .srv-img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 35px; border-radius: 16px; width: 100%; max-width: 650px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { color: var(--primary); font-family: 'Playfair Display', serif; font-size: 1.8rem; }
        .close-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo_transparent.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="services.html" class="active"><i class="fas fa-gem"></i> Services</a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Manage Services</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="page-header">
                <p style="color:var(--text-muted);">Manage salon & beauty services offered at Sabla Singh Academy.</p>
                <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Add New Service</button>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Icon / Image</th>
                            <th>Service Title</th>
                            <th>Category / Details</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="servicesTable">
                        <tr><td colspan="5" style="text-align:center;">Loading services...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Service</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <form id="serviceForm">
                <input type="hidden" id="sId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Service Title</label>
                        <input type="text" id="sTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Icon Class (FontAwesome)</label>
                        <input type="text" id="sIcon" placeholder="fas fa-gem">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subtitle / Description</label>
                    <input type="text" id="sSubtitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Image Filename or URL</label>
                        <input type="text" id="sImage" placeholder="service_lash.jpg">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="sStatus" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ddd;">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn-gold" style="font-size:1.1rem; padding: 14px; margin-top: 15px;" onclick="saveService(this)"><i class="fas fa-save"></i> Save Service</button>
            </form>
        </div>
    </div>

    <script>
        const defaultServices = [
            { id: 1, title: "Bridal & HD Makeup", icon: "fas fa-heart", subtitle: "HD, Airbrush, Engagement & Reception Bridal Glam", image: "gal14.jpg", status: "Active" },
            { id: 2, title: "Skin Care & Facial", icon: "fas fa-spa", subtitle: "Hydra Facial, Cleanup, Anti-Aging & Rejuvenation Treatments", image: "gal1.jpg", status: "Active" },
            { id: 3, title: "Hair Styling & Spa", icon: "fas fa-scissors", subtitle: "Haircut, Keratin, Hair Botox, Smoothening & Chemical Styling", image: "course_hair.jpg", status: "Active" },
            { id: 4, title: "Nail Extensions & Art", icon: "fas fa-hand-sparkles", subtitle: "Gel, Acrylic, Ombre, 3D Nail Art & Chrome Finishes", image: "course_nails.jpg", status: "Active" },
            { id: 5, title: "Lash Extensions", icon: "fas fa-eye", subtitle: "Classic, Hybrid & Russian Volume Eyelash Extensions", image: "service_lash.jpg", status: "Active" }
        ];

        let allServices = JSON.parse(localStorage.getItem('admin_services')) || defaultServices;

        function renderServices() {
            const tbody = document.getElementById('servicesTable');
            tbody.innerHTML = '';
            
            allServices.forEach(s => {
                const imgPath = s.image.startsWith('http') ? s.image : '../' + s.image;
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${imgPath}" class="srv-img-preview" alt="img" onerror="this.src='../logo_transparent.png'"></td>
                        <td><strong style="font-size:1.1rem; color:var(--primary);"><i class="${s.icon || 'fas fa-gem'}" style="color:var(--gold);margin-right:8px;"></i> ${s.title}</strong></td>
                        <td><span style="font-size:0.95rem;color:#666;">${s.subtitle}</span></td>
                        <td><span class="badge" style="background:#d4edda;color:#155724;font-size:0.85rem;padding:6px 12px;border-radius:20px;">${s.status}</span></td>
                        <td class="action-btns">
                            <button title="Edit" onclick='editService(${s.id})' style="font-size:1.1rem;margin-right:12px;color:var(--gold);"><i class="fas fa-edit"></i> Edit</button>
                            <button title="Delete" onclick="deleteService(${s.id})" style="font-size:1.1rem;color:#dc3545;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New Service';
            document.getElementById('sId').value = '';
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('serviceModal').style.display = 'none';
        }

        function editService(id) {
            const s = allServices.find(x => x.id === id);
            if(!s) return;
            document.getElementById('modalTitle').innerText = 'Edit Service: ' + s.title;
            document.getElementById('sId').value = s.id;
            document.getElementById('sTitle').value = s.title;
            document.getElementById('sIcon').value = s.icon || '';
            document.getElementById('sSubtitle').value = s.subtitle;
            document.getElementById('sImage').value = s.image;
            document.getElementById('sStatus').value = s.status || 'Active';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function saveService(btn) {
            const id = document.getElementById('sId').value;
            const title = document.getElementById('sTitle').value.trim();
            const icon = document.getElementById('sIcon').value.trim() || 'fas fa-gem';
            const subtitle = document.getElementById('sSubtitle').value.trim();
            const image = document.getElementById('sImage').value.trim() || 'gal14.jpg';
            const status = document.getElementById('sStatus').value;

            if (!title) {
                alert('Please enter service title');
                return;
            }

            if (id) {
                const idx = allServices.findIndex(x => x.id == id);
                if (idx !== -1) {
                    allServices[idx] = { ...allServices[idx], title, icon, subtitle, image, status };
                }
            } else {
                const newId = Date.now();
                allServices.push({ id: newId, title, icon, subtitle, image, status });
            }

            localStorage.setItem('admin_services', JSON.stringify(allServices));
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
            btn.style.background = '#28a745';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                closeModal();
                renderServices();
            }, 800);
        }

        function deleteService(id) {
            if(confirm('Are you sure you want to delete this service?')) {
                allServices = allServices.filter(x => x.id !== id);
                localStorage.setItem('admin_services', JSON.stringify(allServices));
                renderServices();
            }
        }

        renderServices();
    </script>
</body>
</html>
