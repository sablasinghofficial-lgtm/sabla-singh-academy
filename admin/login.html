<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card">
        <img src="../logo_transparent.png" alt="Sabla Singh Academy" style="max-height: 80px; width: auto; margin-bottom: 20px;">
        <h2>Admin Portal</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Enter your credentials to access the academy management panel</p>
        
        <form id="loginForm" onsubmit="handleLogin(event); return false;">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="e.g. Sablasingh@0404" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="button" class="btn-gold" id="loginBtn" onclick="handleLogin(event)">SIGN IN</button>
            <div class="error-msg" id="errorMsg" style="display:none; color: #dc3545; background: #ffe6e6; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.85rem;"></div>
        </form>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('admin_logged_in') === 'true') {
            window.location.replace('dashboard.html');
        }

        function handleLogin(e) {
            if (e && e.preventDefault) e.preventDefault();
            
            var userField = document.getElementById('username');
            var passField = document.getElementById('password');
            var errorMsg = document.getElementById('errorMsg');
            var btn = document.getElementById('loginBtn');

            var user = userField.value.trim().toLowerCase();
            var pass = passField.value.trim();

            errorMsg.style.display = 'none';

            if (!user || !pass) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Please enter both username and password.';
                return false;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            btn.disabled = true;

            var validUsers = [
                'sablasingh@0404',
                'sablasinghofficial@gmail.com',
                'admin'
            ];
            var validPass = 'sablasingh123';

            if (validUsers.indexOf(user) !== -1 && pass === validPass) {
                localStorage.setItem('admin_logged_in', 'true');
                localStorage.setItem('admin_user', 'Sabla Singh');
                btn.innerHTML = '<i class="fas fa-check"></i> Success! Opening...';
                btn.style.background = '#28a745';
                
                setTimeout(function() {
                    window.location.replace('dashboard.html');
                }, 400);
                return false;
            } else {
                setTimeout(function() {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = 'Invalid username or password. Please try again.';
                    btn.innerHTML = 'SIGN IN';
                    btn.disabled = false;
                    btn.style.background = '';
                }, 400);
                return false;
            }
        }

        // Allow Enter key in inputs
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin(e);
        });
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin(e);
        });
    </script>
</body>
</html>
