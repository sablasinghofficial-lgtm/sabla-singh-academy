<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card">
        <img src="../logo_transparent.png" alt="Sabla Singh Academy" style="max-height: 80px; width: auto; margin-bottom: 20px;">
        <h2>Admin Portal</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Enter your credentials to access the academy management panel</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="e.g. Sablasingh@0404" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-gold" id="loginBtn">Sign In</button>
            <div class="error-msg" id="errorMsg" style="display:none; color: #dc3545; background: #ffe6e6; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.85rem;"></div>
        </form>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword } from './js/firebase-init.js';

        // If already logged in, redirect to dashboard
        if (localStorage.getItem('admin_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }

        const validUsernames = ['sablasingh@0404', 'sablasinghofficial@gmail.com', 'admin'];
        const validPassword = 'sablasingh123';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            btn.disabled = true;

            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value;

            // Check admin credentials
            const isValidUser = validUsernames.includes(inputUser.toLowerCase());
            const isValidPass = (inputPass === validPassword);

            if (isValidUser && isValidPass) {
                // Set authenticated admin session
                localStorage.setItem('admin_logged_in', 'true');
                localStorage.setItem('admin_user', 'Sabla Singh');
                
                // Attempt Firebase Auth in background if enabled
                try {
                    if (auth && signInWithEmailAndPassword) {
                        await signInWithEmailAndPassword(auth, 'sablasinghofficial@gmail.com', inputPass);
                    }
                } catch (fbErr) {
                    console.log('Firebase Auth fallback active:', fbErr.message);
                }

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Invalid username or password. Please try again.';
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
