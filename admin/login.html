<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="module" src="js/firebase-init.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="js/cloudinary-init.js"></script>

</head>
<body class="login-page">
    <div class="login-card">
        <img src="../logo_transparent.png" alt="Sabla Singh Academy">
        <h2>Admin Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-gold">Sign In</button>
            <div class="error-msg" id="errorMsg">Invalid username or password.</div>
        </form>
    </div>

    
    <script type="module">
        import { auth, signInWithEmailAndPassword } from './js/firebase-init.js';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            let email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Map custom username to actual Firebase email
            if (email === 'Sablasingh@0404' || email.toLowerCase() === 'admin') {
                email = 'sablasinghofficial@gmail.com';
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').innerText = "Error: Invalid credentials or user not found.";
                console.error(err);
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
