<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Sabla Singh Academy</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../logo.png" alt="Logo"></div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="queries.html"><i class="fas fa-envelope"></i> Enquiries</a>
            <a href="services.html"><i class="fas fa-gem"></i> Services</a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i> Courses</a>
            <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
            <a href="vlogs.html"><i class="fas fa-video"></i> Vlogs</a>
            <a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Academy Settings</div>
            <div class="topbar-user">
                <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="content-area">
            <div class="login-card" style="margin: 0 auto; max-width: 800px; text-align: left; padding: 50px;">
                <h2 style="font-family:'Playfair Display',serif; color:var(--primary); font-size:2.5rem; margin-bottom: 10px;">Contact Information</h2>
                <p style="color:var(--text-muted); font-size:1.1rem; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">Manage your academy's core details and contact information.</p>
                
                <form id="settingsForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                        <div class="form-group">
                            <label><i class="fas fa-building" style="color:var(--gold);"></i> Academy Name</label>
                            <input type="text" value="Sabla Singh Academy" class="premium-input">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user-tie" style="color:var(--gold);"></i> Founder Name</label>
                            <input type="text" value="Sabla Singh" class="premium-input">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-phone-alt" style="color:var(--gold);"></i> Primary Phone</label>
                            <input type="text" value="+91 8603388406" class="premium-input">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-envelope" style="color:var(--gold);"></i> Email Address</label>
                            <input type="text" value="sablasinghofficial@gmail.com" class="premium-input">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label><i class="fas fa-map-marker-alt" style="color:var(--gold);"></i> Full Address</label>
                            <input type="text" value="Studio S, Shivshakti Nagar, Opp. Sarala Birla Public School, Mahilong, Ranchi" class="premium-input">
                        </div>
                    </div>
                    
                    <button type="button" class="btn-gold" style="margin-top: 30px; font-size: 1.3rem; padding: 20px;" onclick="saveSettings(this)"><i class="fas fa-save"></i> Save & Update Details</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function saveSettings(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Updated Successfully';
                btn.style.background = '#28a745';
                btn.style.color = '#fff';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.disabled = false;
                }, 2000);
            }, 1000);
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
